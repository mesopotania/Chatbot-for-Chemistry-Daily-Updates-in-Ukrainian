name = "khimiya-shchodnya"
main = "src/index.ts"
compatibility_date = "2026-07-27"
preview_urls = false # private bot: no extra public preview URLs, only the main worker route

[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "khimiya-shchodnya-db"
database_id = "9e7bfbbf-6040-4825-b2c6-23ce78b9367e"

[vars]
AUTHOR_CHAT_ID = "373430678"
SEND_HOUR = "9" # sends at 09:00 Europe/Kyiv (DST-safe; hourly cron checks the local hour)
TIMEZONE = "Europe/Kyiv"
# Daily recipients are no longer a static var: they self-activate by sending
# the ACTIVATION_CODE_WORD secret to the bot (set via `wrangler secret put`),
# and are stored in the `recipients` D1 table.
